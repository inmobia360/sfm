<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Contextos de autoridad</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="ribbon">GOBERNANZA DEMO · DATOS SINTÉTICOS</div><main class="standalone"><section class="card"><span class="tag">ROLE CONTEXT / AUTHORITY MODEL</span><h1>Separación por responsabilidad</h1><p class="muted">Cada contexto recibe únicamente las vistas y acciones necesarias para su ámbito. Las decisiones sensibles escalan a una persona autorizada.</p><label>Seleccionar contexto <select id="role"><option value="infante">INFANTE · Presidente</option><option value="janitorial">JANITORIAL · CEO de división</option><option value="supervisor">SUP-001 · Supervisor</option><option value="hr">HR-001 · Recursos Humanos</option><option value="worker">JAN-007 · Trabajador</option></select></label><div id="summary" class="grid"></div></section><section class="card"><h2>Permisos efectivos</h2><div id="matrix"></div></section></main><script>
const policies={infante:{name:'INFANTE',scope:'Corporativo agregado',views:['Dashboard ejecutivo','Todas las divisiones','Centro de agentes','Auditoría'],actions:['Asignar cualquier tarea','Aprobar excepciones','Escalar a dirección'],limits:'No opera datos personales innecesarios de una división.'},janitorial:{name:'JANITORIAL',scope:'División Janitorial',views:['Centros y servicios','Operaciones','Calidad','Payroll preparatorio'],actions:['Crear ofertas','Gestionar contratos','Asignar turnos','Solicitar presupuesto'],limits:'No puede consultar datos de Security, Landscaping u otras divisiones.'},supervisor:{name:'SUP-001',scope:'Centros asignados',views:['Tareas','Checklist','Incidencias','Formación'],actions:['Validar servicio','Escalar incidencia','Solicitar cobertura'],limits:'No aprueba nómina, presupuesto ni cambios contractuales.'},hr:{name:'HR-001',scope:'Personas y formación',views:['Employee 360','Onboarding','Microcursos'],actions:['Crear alta demo','Asignar formación','Solicitar revisión'],limits:'No accede a presupuestos ni a información operativa ajena a RRHH.'},worker:{name:'JAN-007',scope:'Tareas propias',views:['Mi turno','Checklist','Mi formación','Reportar incidencia'],actions:['Fichar en demo','Completar checklist','Reportar incidencia'],limits:'No puede ver otros empleados, presupuestos, contratos ni nómina.'}};
const select=document.querySelector('#role'),summary=document.querySelector('#summary'),matrix=document.querySelector('#matrix');function render(){const p=policies[select.value];summary.innerHTML=[['Identidad',p.name],['Ámbito',p.scope],['Escalado','INFANTE / humano autorizado']].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');matrix.innerHTML=`<div class="row"><span class="badge">VISTAS</span><div><b>${p.views.join(' · ')}</b><br><small class="muted">Solo información del ámbito asignado</small></div></div><div class="row"><span class="badge">ACCIONES</span><div><b>${p.actions.join(' · ')}</b><br><small class="muted">Las acciones sensibles requieren aprobación</small></div></div><div class="row"><span class="badge warn">LÍMITE</span><div><b>${p.limits}</b><br><small class="muted">Política de aislamiento activa</small></div></div>`}select.onchange=render;render();
</script></body></html>
