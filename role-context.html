<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Contextos de autoridad</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="ribbon">GOBERNANZA DEMO · DATOS SINTÉTICOS</div><main class="standalone"><section class="card"><span class="tag">ROLE CONTEXT / AUTHORITY MODEL</span><h1>Separación por responsabilidad</h1><p class="muted">Cada contexto recibe únicamente las vistas y acciones necesarias para su ámbito. Las decisiones sensibles escalan a una persona autorizada.</p><label>Seleccionar contexto <select id="role"><option value="infante">Tier 1 · INFANTE / Presidente / VP</option><option value="controller">Tier 2 · Controller / Finanzas</option><option value="hr">Tier 2 · HR-001 · Recursos Humanos</option><option value="janitorial">Tier 3 · JANITORIAL · CEO de división</option><option value="am">Tier 4 · Account Manager · Clientes</option><option value="supervisor">Tier 5 · SUP-001 · Supervisor</option><option value="worker">Tier 5 · JAN-007 · Trabajador</option></select></label><div id="summary" class="grid"></div></section><section class="card"><h2>Permisos efectivos</h2><div id="matrix"></div></section></main><script>
const policies={
  infante:{name:'INFANTE · Presidente / VP (Tier 1)',scope:'Corporativo agregado multicliente y multidivisión',views:['Dashboard ejecutivo consolidado','Mapa de divisiones','DSS Prescriptivo','Decision Ledger','Auditoría inmutable'],actions:['Asignar cualquier tarea interdivisional','Aprobar excepciones de payroll','Rebalancear presupuestos entre divisiones'],limits:'No opera ni almacena PII clínica o privada innecesaria de operarios.'},
  controller:{name:'CONTROLLER · Finanzas (Tier 2)',scope:'Auditoría financiera, márgenes y desvíos de coste',views:['Desvíos de horas extraordinarias','Coste de la inacción (CoI)','Márgenes por contrato','Payroll preparatorio'],actions:['Auditar nómina preparatoria','Bloquear horas extra no presupuestadas','Validar compensaciones extraordinarias'],limits:'No aprueba gastos excepcionales sin escalado a INFANTE; no accede a fichas médicas de trabajadores.'},
  hr:{name:'HR-001 · Recursos Humanos (Tier 2)',scope:'Personas, formación, rotación y absentismo',views:['Employee 360 completo','Microcursos y onboarding','Historial de absentismo','Planes de carrera'],actions:['Crear altas y bajas sintéticas','Asignar microcursos obligatorios','Autorizar bolsas de guardia urgente'],limits:'No accede a márgenes comerciales, precios pactados con clientes ni presupuestos de maquinaria.'},
  janitorial:{name:'JANITORIAL · CEO de división (Tier 3)',scope:'División Janitorial (Aislamiento divisional estricto)',views:['Centros y servicios de limpieza','Operaciones de brigada','Calidad y SLAs','Cuadrantes operativos'],actions:['Gestionar contratos de limpieza','Asignar cuadrantes y retenes','Proponer compras de maquinaria'],limits:'Estrictamente aislado: no puede consultar datos ni recursos de Security, Landscaping u otras divisiones.'},
  am:{name:'ACCOUNT MANAGER · Gestor de Cuentas (Tier 4)',scope:'Salud contractual de cuentas y centros asignados',views:['Salud de cuentas cliente','Historial de incidencias y quejas','Cumplimiento de SLAs y frecuencias'],actions:['Solicitar refuerzos de cuadrilla','Acordar reposiciones de servicio','Escalar quejas críticas al CEO'],limits:'No accede a costes laborales individuales de los operarios ni a liquidaciones de nómina.'},
  supervisor:{name:'SUP-001 · Supervisor de Centro (Tier 5)',scope:'Centros físicos asignados en su turno',views:['Tareas y turnos en tiempo real','Checklist de apertura','Fichajes con Geofence','Incidencias in situ'],actions:['Validar servicio ejecutado','Escalar incidencias a Calidad','Reasignar tareas del turno'],limits:'No aprueba nóminas legales, presupuestos contractuales ni cambios de tarifa al cliente.'},
  worker:{name:'JAN-007 · Operario de Campo (Tier 5)',scope:'Turno propio y tareas personales asignadas',views:['Mi cuadrante del día','Checklist de zona asignada','Mi formación PRL','Botón de alerta rápida'],actions:['Fichaje con verificación geofence','Completar checklist con firma digital','Reportar avería o falta de stock'],limits:'No tiene visibilidad sobre otros operarios, márgenes, contratos, tarifas ni datos de clientes ajenos.'}
};
const select=document.querySelector('#role'),summary=document.querySelector('#summary'),matrix=document.querySelector('#matrix');function render(){const p=policies[select.value];summary.innerHTML=[['Identidad',p.name],['Ámbito',p.scope],['Escalado','INFANTE / humano autorizado']].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');matrix.innerHTML=`<div class="row"><span class="badge">VISTAS</span><div><b>${p.views.join(' · ')}</b><br><small class="muted">Solo información del ámbito asignado</small></div></div><div class="row"><span class="badge">ACCIONES</span><div><b>${p.actions.join(' · ')}</b><br><small class="muted">Las acciones sensibles requieren aprobación</small></div></div><div class="row"><span class="badge warn">LÍMITE</span><div><b>${p.limits}</b><br><small class="muted">Política de aislamiento activa</small></div></div>`}select.onchange=render;render();
</script></body></html>
