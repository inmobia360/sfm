<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Alertas</title><link rel="stylesheet" href="styles.css"><style>.alerts{max-width:1000px;margin:auto}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter button.active{border-color:var(--c);color:var(--c)}.alert-card{display:flex;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #2b405e88}.alert-card:first-child{border-top:0}.alert-card .copy{flex:1}.alert-card strong{display:block}.alert-card small{color:var(--m)}</style></head><body><div class="ribbon">ENTORNO DEMO · ALERTAS SINTÉTICAS · CONTROL POR ROL</div><main class="alerts"><header><div><small>SFM OPERATIONS INTELLIGENCE · NOTIFICATIONS</small><h1>Centro de alertas</h1></div><a class="action" href="launch.html">← Lanzador de demo</a></header><section class="card"><span class="tag">BANDEJA DE TRABAJO</span><div class="filter" id="filters"><button class="action active" data-filter="all">Todas</button><button class="action" data-filter="worker">Trabajador</button><button class="action" data-filter="supervisor">Supervisor</button><button class="action" data-filter="hr">RRHH</button><button class="action" data-filter="ceo">Dirección</button></div><div id="alerts"></div></section></main><script>const data=[['supervisor','Alta','Fichaje fuera de zona de JAN-008','SUP-001 · requiere revisión','bad'],['hr','Media','Documentación pendiente de JAN-011','HR-001 · onboarding','warn'],['worker','Media','Nuevo curso asignado: TR-005','JAN-007 · formación','warn'],['ceo','Alta','Centro C-001 presenta reincidencia','INFANTE · decisión recomendada','bad'],['supervisor','Baja','Tarea T-1044 completada','SUP-001 · informativa','good']];let current='all';const out=document.querySelector('#alerts');function render(){out.innerHTML=data.filter(x=>current==='all'||x[0]===current).map((x,i)=>`<div class="alert-card"><span class="badge ${x[4]}">${x[1]}</span><div class="copy"><strong>${x[2]}</strong><small>${x[3]}</small></div><button class="action" data-msg="Alerta marcada en revisión">Revisar</button></div>`).join('')}document.querySelector('#filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;current=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};document.body.onclick=e=>{if(!e.target.dataset.msg)return;const t=document.createElement('div');t.id='toast';t.className='show';t.textContent=e.target.dataset.msg;document.body.append(t);setTimeout(()=>t.remove(),2000)};render();</script></body></html>
