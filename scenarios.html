<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Escenarios ejecutivos</title><link rel="stylesheet" href="styles.css"></head><body><div class="ribbon">ENTORNO DEMO · ESCENARIOS SINTÉTICOS</div><main><header><div class="header-brand"><div class="brand-logo-badge"><img src="sfm-logo.png" alt="SFM Services, Inc."></div><div><small>SFM OPERATIONS INTELLIGENCE · MODO PRESENTACIÓN</small><h1>Recorrido end-to-end</h1></div></div><a class="action" href="launch.html">← Volver al lanzador</a></header><section class="card"><span class="tag">HISTORIA DEL PILOTO</span><h2>De una incorporación a una decisión aprobada</h2><p class="muted">Cada acción modifica el estado común y genera trazabilidad local.</p><div class="scenario-nav" id="scenarioNav"></div><div id="scenario" class="scenario-content"></div></section></main><script src="data.js"></script><script>
const scenarios=[{title:'01 · Alta y formación',tag:'ONBOARDING + LEARNING',body:'<h3>JAN-011 · incorporación operativa</h3><p class="muted">Requisitos globales y de puesto/centro asignados. La formación queda pendiente de revisión humana.</p><button class="action" data-act="Onboarding de JAN-011 asignado">Registrar asignación</button>'},{title:'02 · Fichaje geolocalizado',tag:'TIME & ATTENDANCE',body:'<h3>Tres estados, una revisión humana</h3><div class="row"><span class="badge">Válido</span><div><b>Entrada en C-001 · 07:58</b><br><small class="muted">Geofence simulado · 42 m · turno correcto</small></div></div><button class="action" data-act="Fichaje de JAN-008 revisado por SUP-001">Aprobar caso sintético</button>'},{title:'03 · Rotación de Pablo',tag:'SCHEDULING + COVERAGE',body:'<h3>JAN-007 · Pablo Martínez</h3><p class="muted">Rotación multicentro validada: no existen conflictos de agenda.</p><button class="action" data-act="Rotación de JAN-007 validada sin conflictos">Validar rotación</button>'},{title:'04 · Incidencia y calidad',tag:'INCIDENTS + QA',body:'<h3>INC-021 · Reincidencia en baños</h3><p class="muted">La IA propone clasificación; calidad conserva la decisión final.</p><button class="action" data-act="Acción correctiva aprobada por QA-001">Aprobar acción</button>'},{title:'05 · Informe para INFANTE',tag:'REPORTING + GOVERNANCE',body:'<h3>Resumen ejecutivo de Janitorial</h3><p class="muted">Servicios, cobertura, calidad e incidencias listos para revisión corporativa.</p><button class="action" data-act="Informe sintético enviado a INFANTE">Enviar resumen</button>'}];
let active=0;const nav=document.querySelector('#scenarioNav'),out=document.querySelector('#scenario');nav.innerHTML=scenarios.map((s,i)=>`<button class="action ${i===0?'selected':''}" data-s="${i}">${s.title}</button>`).join('');function render(){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',+b.dataset.s===active));out.innerHTML=`<span class="tag">${scenarios[active].tag}</span>${scenarios[active].body}`}nav.onclick=e=>{const b=e.target.closest('[data-s]');if(b){active=+b.dataset.s;render()}};document.body.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const s=sfmLoad();sfmCommit(s,'DEMO-USER',b.dataset.act,'Executive scenarios');sfmPublish(s);b.textContent='Registrado ✓';b.disabled=true};render();
</script></body></html>
