<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Agent roster</title><link rel="stylesheet" href="styles.css"></head><body><div class="ribbon">SFM AGENT ROSTER · CONFIGURACIÓN DEMO</div><main><header><div><small>GOVERNANCE · AGENT REGISTRY</small><h1>Equipo de agentes</h1></div><a class="action" href="launch.html">← Launchpad</a></header><section class="card"><div class="panel-head"><h3>INFANTE · estructura activa</h3><select id="division"><option value="ALL">Todas las divisiones</option><option value="CORP">Staff corporativo</option><option value="JANITORIAL">JANITORIAL</option></select></div><p id="count" class="muted"></p><div id="agents"></div></section></main><script>fetch('agent-config.json').then(response=>response.json()).then(config=>{const select=document.querySelector('#division'),list=document.querySelector('#agents'),count=document.querySelector('#count');function render(){const items=config.activeAgents.filter(agent=>select.value==='ALL'||agent.divisionId===select.value);count.textContent=`${items.length} agentes visibles · director: ${config.director} · aprobación humana: ${config.governance.humanApprovalRequired?'activa':'inactiva'}`;list.innerHTML=items.map(agent=>`<div class="row"><span class="badge">${agent.role}</span><div><b>${agent.agentId}</b><br><small class="muted">${agent.divisionId} · especialista registrado</small></div><span class="good">Activo</span></div>`).join('')}select.onchange=render;render()});</script></body></html>
