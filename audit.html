<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Audit log</title><link rel="stylesheet" href="styles.css"></head><body><div class="ribbon">ENTORNO DEMO · AUDIT LOG SINTÉTICO</div><main><header><div><small>SFM OPERATIONS INTELLIGENCE · GOVERNANCE</small><h1>Audit log y trazabilidad</h1></div><a class="action" href="index.html">← Centro ejecutivo</a></header><section class="card"><div class="panel-head"><h3>Eventos registrados</h3><button class="action" id="reset">Restablecer demo</button></div><p class="muted">Cada evento muestra actor, módulo y acción. En producción estos eventos incluirían tenant, request y trace IDs.</p><div id="log"></div></section></main><script src="data.js"></script><script>let s=sfmLoad();function render(){document.querySelector('#log').innerHTML=s.audit.slice().reverse().map(e=>`<div class="row"><span class="badge">${e.module}</span><div><b>${e.action}</b><br><small class="muted">${e.actor} · ${e.at}</small></div><span class="good">Registrado</span></div>`).join('')}document.querySelector('#reset').onclick=()=>{s=sfmReset();render()};render();</script></body></html>
