<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFM · Audit log</title><link rel="stylesheet" href="styles.css"></head><body><div class="ribbon">ENTORNO DEMO · AUDIT LOG SINTÉTICO</div><main><header><div class="header-brand"><div class="brand-logo-badge"><img src="sfm-logo.png" alt="SFM Services, Inc."></div><div><small>SFM OPERATIONS INTELLIGENCE · GOVERNANCE</small><h1>Audit log y trazabilidad</h1></div></div><a class="action" href="launch.html">← Volver al lanzador</a></header><section class="card"><div class="panel-head"><h3>Eventos registrados <small id="count"></small></h3><button class="action" id="reset">Restablecer demo</button></div><p class="muted">Los eventos se leen del estado común y muestran actor, módulo y acción. En producción incluirían tenant, request y trace IDs.</p><div id="log"></div></section></main><script src="data.js"></script><script>let s=sfmLoad();const log=document.querySelector('#log'),count=document.querySelector('#count');function render(){const events=s.audit.slice().reverse();count.textContent='· '+events.length;log.innerHTML=events.map(e=>`<div class="row"><span class="badge">${e.module}</span><div><b>${e.action}</b><br><small class="muted">${e.actor} · ${e.at}</small></div><span class="good">Registrado</span></div>`).join('')}document.querySelector('#reset').onclick=()=>{s=sfmReset();sfmPublish(s);render()};render();sfmSubscribe(next=>{s=next;render()});</script></body></html>
